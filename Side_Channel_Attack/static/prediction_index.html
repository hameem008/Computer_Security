<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Fingerprinting</title>
    <!-- Pico CSS - minimal CSS framework -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Alpine.js - minimal reactive framework -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .results-table {
            margin: 0 auto;
            width: 100%;
        }
        
        .heatmap-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .heatmap-container {
            text-align: center;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .heatmap-container img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .prediction-result {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .high-confidence {
            color: #2e7d32;
        }
        
        .medium-confidence {
            color: #ed6c02;
        }
        
        .low-confidence {
            color: #d32f2f;
        }
    </style>
</head>
<body>
    <main class="container" x-data="app()">
        <h1>CSE406: Website Fingerprinting</h1>
        
        <div class="button-group">
            <button @click="collectLatencyData()" :disabled="isCollecting">Collect Latency Data</button>
            <button @click="collectTraceData()" :disabled="isCollecting">Collect Trace</button>
            <button @click="downloadTraces()" :disabled="isCollecting">Download Traces</button>
            <button @click="clearResults()" :disabled="isCollecting">Clear Results</button>
        </div>
        
        <div x-show="status" role="alert" x-text="status" 
             :class="{'alert-success': !statusIsError, 'alert-error': statusIsError}"></div>
        
        <!-- Latency Results Table -->
        <template x-if="latencyResults && !showingTraces">
            <div class="results-container">
                <h3>Latency Results</h3>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>N</th>
                            <th>Median Access Latency (ms)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(time, n) in latencyResults" :key="n">
                            <tr>
                                <td x-text="n"></td>
                                <td x-text="time.toFixed(2)"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
        
        <!-- Heatmap gallery for all traces -->
        <template x-if="heatmaps.length > 0">
            <div>
                <h3>Trace Heatmaps</h3>
                <div class="heatmap-gallery">
                    <template x-for="(heatmap, index) in heatmaps" :key="index">
                        <div class="heatmap-container">
                            <img :src="heatmap.src" :alt="'Heatmap ' + (index + 1)" />
                            <template x-if="heatmap.prediction">
                                <div class="prediction-result" 
                                     :class="{
                                         'high-confidence': heatmap.prediction.confidence >= 70,
                                         'medium-confidence': heatmap.prediction.confidence >= 30 && heatmap.prediction.confidence < 70,
                                         'low-confidence': heatmap.prediction.confidence < 30
                                     }">
                                    Predicted: <span x-text="heatmap.prediction.website"></span><br>
                                    Confidence: <span x-text="heatmap.prediction.confidence.toFixed(1) + '%'"></span>
                                </div>
                            </template>
                            <p x-text="'Trace ' + (index + 1)"></p>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </main>

    <script src="prediction_index.js"></script>
    <script>
        // Initialize app by fetching existing results when page loads
        document.addEventListener('alpine:init', () => {
            window.Alpine.store('app').fetchResults();
        });
    </script>
</body>
</html>
